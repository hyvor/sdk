name: JS SDK Publish
run-name: JS SDK Publish ${{ inputs.version }}

# Publishes each js/packages/<dir> subdirectory to npm, one package per
# product plus the shared core package. All packages are released together
# under the same version tag, since they're developed and reviewed as one
# monorepo.
#
# Uses npm trusted publishing (OIDC) instead of a long-lived npm token: each
# package must have this workflow (hyvor/sdk, js-publish.yml) added as a
# trusted publisher in its npm package settings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [core, talk, post]
    steps:
      - name: Determine version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for trusted publishing (OIDC) support
        run: npm install -g npm@latest

      - name: Install and build the monorepo workspace
        working-directory: js
        run: |
          npm install
          npm run build --workspaces --if-present

      - name: Set package version
        working-directory: js/packages/${{ matrix.dir }}
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: js/packages/${{ matrix.dir }}
        run: npm publish --access public
