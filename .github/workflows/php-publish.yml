name: PHP SDK Publish
run-name: PHP SDK Publish ${{ inputs.version }}

# Publishes each php/packages/<dir> subdirectory to its own standalone repo
# and creates a tagged GitHub release there. Packagist is configured to pick
# up new releases from each of those repos automatically via a release
# webhook. All packages are released together under the same version tag,
# since they're developed and reviewed as one monorepo.
#
# Requires a repo secret PHP_SDK_PUBLISH_TOKEN: a GitHub personal access
# token (or fine-grained token) with contents + workflows write access to
# hyvor/sdk-php-core, hyvor/sdk-php-talk, and hyvor/sdk-php-post.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: core
            repo: hyvor/sdk-php-core
          - dir: talk
            repo: hyvor/sdk-php-talk
          - dir: post
            repo: hyvor/sdk-php-post
    steps:
      - name: Determine version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PHP_SDK_PUBLISH_TOKEN }}
          path: package

      - name: Sync package code
        run: |
          rsync -a --delete --exclude='.git' --exclude='tests/' --exclude='phpunit.xml.dist' monorepo/php/packages/${{ matrix.dir }}/ package/
          rm -rf package/tests package/phpunit.xml.dist

      - name: Strip monorepo-only composer.json fields
        working-directory: package
        run: |
          jq 'del(.version, .repositories, .["autoload-dev"])' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json

      - name: Commit and push
        working-directory: package
        run: |
          git config user.name "hyvor-chef"
          git config user.email "chef@hyvor.com"
          git add -A
          git diff --cached --quiet && echo "No changes to publish." && exit 0
          git commit -m "Release ${{ steps.version.outputs.version }}"
          git push

      - name: Tag and release
        working-directory: package
        env:
          GH_TOKEN: ${{ secrets.PHP_SDK_PUBLISH_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --repo ${{ matrix.repo }} \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
