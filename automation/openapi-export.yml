# Copy to .github/workflows/openapi-export.yml in hyvor/post, hyvor/talk and hyvor/relay,
# and set PRODUCT below. See "Automation" in the SDK repo's README.md.
name: Export OpenAPI & trigger SDK sync

on:
  push:
    branches: [main]
    paths-ignore: [openapi.json]

permissions:
  contents: write

env:
  PRODUCT: post   # post | talk | relay

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_SYNC_TOKEN }}   # so the push below isn't blocked / can trigger nothing recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - run: composer install --no-interaction --no-progress

      # Adjust to how the app dumps its spec (NelmioApiDocBundle shown). Must not need a database.
      - name: Dump OpenAPI
        run: |
          APP_ENV=test php bin/console nelmio:apidoc:dump --format=json --no-pretty \
            | jq --indent 2 . > openapi.json

      - name: Commit openapi.json if changed
        id: commit
        run: |
          if git diff --quiet -- openapi.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "hyvor-bot"
          git config user.email "bot@hyvor.com"
          git add openapi.json
          git commit -m "chore: update openapi.json [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger SDK sync
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_TOKEN }}
        run: |
          gh api repos/hyvor/sdk/dispatches -f event_type=openapi-updated \
            -f "client_payload[product]=$PRODUCT" -f "client_payload[sha]=$(git rev-parse HEAD)"
